name: Linux AppImage

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Igual que windows-exe.yml: push solo en master para no duplicar runs en PRs.
concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar squashfs-tools + FUSE (para correr el AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools libfuse2t64

      - name: Descargar runtime oficial AppImageKit (Type2, x86_64)
        run: |
          curl -fsSL -o "$HOME/runtime-x86_64" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-x86_64
          chmod +x "$HOME/runtime-x86_64"

      - name: Venv + paquete + pyinstaller + deps de bandeja
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[gui]'
          .venv/bin/pip install pyinstaller pytest

      - name: Tests de regresión (pytest)
        run: .venv/bin/python -m pytest tests/ -q

      - name: Smoke test CLI (antes de empaquetar)
        run: .venv/bin/python -m club_autotalplay.cli --help

      - name: Build AppImage
        run: RUNTIME="$HOME/runtime-x86_64" ./packaging/build_appimage.sh

      - name: Smoke test AppImage (status)
        run: |
          ls -la dist/
          ./dist/Club-AutotalPlay-x86_64.AppImage status

      - name: Guardar artifact (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: Club-AutotalPlay-linux-x86_64
          path: dist/Club-AutotalPlay-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Descargar AppImage validado
        uses: actions/download-artifact@v4
        with:
          name: Club-AutotalPlay-linux-x86_64
          path: dist

      - name: Subir a Release
        env:
          GH_TOKEN: ${{ github.token }}
          # sin checkout no hay .git: gh necesita el repo explicito
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag \
              --title "$TAG_NAME" --notes "Build automático desde CI" || \
              gh release view "$TAG_NAME" >/dev/null
          fi
          gh release upload "$TAG_NAME" \
            dist/Club-AutotalPlay-x86_64.AppImage \
            --clobber
