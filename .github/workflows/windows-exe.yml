name: Windows .exe

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# push solo esta en master: un push a la rama del PR NO dispara por push,
# asi que nunca salen dos runs. cancel-in-progress evita carreras si hay
# varios commits seguidos.
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para subir los .exe a un Release (solo aplica con tag)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar paquete + pyinstaller + deps de bandeja
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pystray Pillow pytest

      - name: Tests de regresión (pytest)
        run: python -m pytest tests/ -q

      - name: Smoke test CLI (antes de empaquetar)
        run: python -m club_autotalplay.cli --help

      # 1) .exe de consola: CLI (status/once/run/debug/install/uninstall)
      - name: Build .exe de consola (onefile)
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name Club-AutotalPlay
          --distpath dist --workpath build/pyi-work --specpath build
          --paths src
          packaging/console_entry.py

      # 2) .exe de bandeja: windowed, con pystray (win32) + Pillow + iconos
      # El --add-data va con ruta ABSOLUTA: --specpath build hace que
      # PyInstaller resuelva las rutas relativas contra build/ y no contra el
      # cwd, asi que "src/..." no existiria ahi.
      - name: Build .exe de bandeja (windowed, onefile)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Club-AutotalPlayTray
          --add-data "${{ github.workspace }}\src\club_autotalplay\assets;club_autotalplay/assets"
          --hidden-import pystray._win32
          --collect-all pystray --collect-all PIL
          --distpath dist --workpath build/pyi-work-tray --specpath build
          --paths src
          packaging/tray_entry.py

      - name: Smoke test .exe de consola
        run: dist\Club-AutotalPlay.exe --help

      # El de bandeja es windowed: lanzarlo sin args BLOCK (corre el loop del
      # tray), asi que solo verificamos que exista.
      - name: Smoke test .exe de bandeja (existe)
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Club-AutotalPlayTray.exe)) { throw "falta el .exe de bandeja" }
          Get-Item dist/Club-AutotalPlay.exe, dist/Club-AutotalPlayTray.exe |
            Select-Object Name, Length

      - name: Subir a Release (si hay tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --verify-tag \
              --title "${{ github.ref_name }}" --notes "Build automático desde CI"
          gh release upload "${{ github.ref_name }}" \
            dist/Club-AutotalPlay.exe \
            dist/Club-AutotalPlayTray.exe \
            --clobber

      - name: Guardar artifact (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: Club-AutotalPlay-windows-x64
          path: |
            dist/Club-AutotalPlay.exe
            dist/Club-AutotalPlayTray.exe
