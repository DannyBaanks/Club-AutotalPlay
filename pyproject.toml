[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "club-autotalplay"
version = "0.1.0"
description = "Auto-reconnect para la red publica Club_Totalplay_WiFi (portal cautivo Totalplay)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DannyBaanks" }]
keywords = ["wifi", "captive-portal", "totalplay", "watchdog", "auto-reconnect"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

# El core solo usa stdlib. pystray/Pillow son para la app de escritorio (M2)
# y se declaran en la extra "gui".
dependencies = []

[project.optional-dependencies]
# 'gui' = app de escritorio: tray (pystray) + icono (Pillow) + backend xorg
# (python-xlib, para X11; en Wayland haria falta appindicator/ayatana).
gui = ["pystray>=0.19", "Pillow>=9.0", "python-xlib>=0.31"]

[project.scripts]
club-autotalplay = "club_autotalplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
